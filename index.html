<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket Classifier</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Complaint Ticket Classifier</h1>
      <p class="subtitle">Describe your issue and we'll route it to the right category.</p>
    </header>

    <section class="card">
      <form id="ticket-form" novalidate>
        <label for="complaint">Your complaint</label>
        <textarea
          id="complaint"
          rows="7"
          maxlength="3000"
          placeholder="e.g.Someone used my card for a fraudulent purchase...."
          required
        ></textarea>
        <div class="meta">
          <span id="char-count">0 / 3000</span>
          <span id="error" class="error" role="alert"></span>
        </div>

        <div class="actions">
          <button type="submit" id="submit-btn">
            <span class="btn-text">Classify Ticket</span>
            <span class="spinner" hidden></span>
          </button>
          <button type="button" id="clear-btn" class="secondary">Clear</button>
        </div>
      </form>

      <div class="examples">
        <span>Try an example:</span>
        <button type="button" class="chip" data-text="I deposited a check at the branch last week and the bank put a hold on my checking account. 
I still cannot access my money and nobody can tell me when it will be released.">Bank account services</button>
        <button type="button" class="chip" data-text="Someone used my card for a fraudulent purchase.
 I filed a dispute with the merchant but the bank denied my claim and refused to refund the transaction.">Theft/dispute</button>
        <button type="button" class="chip" data-text="There is a hard inquiry on my credit report that I never authorized.
 It dropped my credit score and I want the credit bureau to remove it.">Credit reporting & inquiries</button>
      </div>
    </section>

    <section id="result" class="card result" hidden>
      <h2>Predicted Category</h2>
      <div id="result-badge" class="badge"></div>
      <div id="confidence-wrap" hidden>
        <div class="confidence-label">Confidence: <strong id="confidence-text"></strong></div>
        <div class="bar"><div id="confidence-bar"></div></div>
      </div>
    </section>

    <footer>
      <small>Powered by a Logistic Regression + TF-IDF model</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
