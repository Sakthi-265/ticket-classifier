name: Build and deploy Python project to Azure Function App - ticket-classifier-api-sakthi

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies into the Functions package folder
        run: |
          pip install -r api/requirements.txt --target="api/.python_packages/lib/site-packages"

      - name: Zip the api folder for deployment
        run: |
          cd api
          zip -r ../release.zip . -x ".venv/*" "local.settings.json" "app.py" "test_model.py"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          rm release.zip

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'ticket-classifier-api-sakthi'
          slot-name: 'Production'
          package: '.'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_7A1D089AB882486BBE5C3F8D2B3078E7 }}
          sku: 'flexconsumption'
